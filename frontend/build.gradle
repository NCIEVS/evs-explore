import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'com.github.node-gradle.node' version '7.1.0'
}

version = '2.6.0.RELEASE'

node {
    version = '22.14.0'
    npmVersion = '10.9.2'
    download = true
    // Track npm's lock metadata instead of hashing the entire dependency tree.
    fastNpmInstall = true
    workDir = layout.buildDirectory.dir('node')
    nodeProjectDir = layout.projectDirectory
    npmWorkDir = layout.buildDirectory.dir('npm')
}

tasks.register('npmBuild', NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build:prod']
}

// Copy the production bundle into the Java web module for packaging.
tasks.register('build', Copy) {
    dependsOn tasks.named('npmBuild')
    from 'dist'
    into '../web/src/main/resources/static'
}
