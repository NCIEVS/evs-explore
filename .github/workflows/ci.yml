name: Build and Tests
on:
  push:
    branches:
      - develop # the primary branch
      - develop-* # primary branch when previous release is still in progress
  pull_request:
    branches:
      - develop # the primary branch
      - develop-* # primary branch when previous release is still in progress
permissions:
    contents: read
    pull-requests: write
jobs:
  run-jest-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Set up Java for the frontend Gradle wrapper
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Dependencies
        run: npm install
      - name: Build Application
        run: bash ./gradlew build --no-daemon
      - name: Run Jest Tests
        run: npm run test
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and Test Java Application
        run: bash ./gradlew clean build --no-daemon
