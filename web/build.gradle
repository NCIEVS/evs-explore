plugins {
    id "java"
    id "eclipse"
    id "war"
    id "org.springframework.boot" version "4.1.1"
    id "io.spring.dependency-management" version "1.1.7"
    id "maven-publish"
}

group = "gov.nih.nci.term.browser.web"
version = "2.6.0.RELEASE"

// Security fixes beyond Boot 4.1.1's BOM; reassess when upgrading Boot.
ext['tomcat.version'] = '11.0.25'
ext['jackson-bom.version'] = '3.1.7'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

springBoot {
    buildInfo()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

tasks.register("zipFile", Zip) {
    def applicationVersion = project.version.toString()
    def zipFileRootDirectory = "${project.name}-${project.version}"
    from("src/main/bin") {
        filePermissions {
            unix("755")
        }
        into "$zipFileRootDirectory/bin"
    }
    from(tasks.named("bootWar")) {
        into "$zipFileRootDirectory/lib"
        rename { String fileName -> fileName.replace("-${applicationVersion}", "") }
    }
}

tasks.named("build") {
    dependsOn tasks.named("zipFile")
}

tasks.named("publishToMavenLocal") {
    dependsOn tasks.named("bootWar"), tasks.named("zipFile")
}

dependencyLocking {
    lockAllConfigurations()
}
